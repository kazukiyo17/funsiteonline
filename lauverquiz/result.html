<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="你的 Laufey 本命主题曲与人格解析。" />
  <title>测试结果 · Laufey Soul Spectrum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf7f2;
      --cream-deep: #f3ebe3;
      --caramel: #8b7355;
      --caramel-deep: #6d5844;
      --peach-soft: rgba(232, 196, 184, 0.38);
      --mint: #9eb8aa;
      --mint-soft: rgba(158, 184, 170, 0.22);
      --gold-line: rgba(196, 165, 116, 0.42);
      --ink: #3d3834;
      --ink-soft: rgba(61, 56, 52, 0.58);
      --radius-lg: clamp(18px, 4vw, 22px);
      --radius-sm: 14px;
      --grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.085'/%3E%3C/svg%3E");
      --grain-fine: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.15' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)' opacity='0.04'/%3E%3C/svg%3E");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: "Nunito", system-ui, sans-serif;
      font-weight: 500;
      color: var(--ink);
      background-color: var(--cream-deep);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 88% 62% at 50% 0%, var(--peach-soft), transparent 54%),
        radial-gradient(ellipse 52% 40% at -5% 88%, var(--mint-soft), transparent 48%),
        linear-gradient(172deg, var(--cream) 0%, var(--cream-deep) 52%, #ebe3d9 100%);
      filter: saturate(0.93) contrast(0.97);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        var(--grain),
        var(--grain-fine),
        repeating-linear-gradient(91deg, transparent 0, transparent 14px, rgba(107, 88, 68, 0.016) 14px, rgba(107, 88, 68, 0.016) 15px),
        radial-gradient(ellipse 88% 74% at 50% 50%, transparent 38%, rgba(61, 56, 52, 0.052) 100%);
    }

    .shell {
      position: relative;
      z-index: 2;
      max-width: 27rem;
      margin: 0 auto;
      padding: clamp(1.35rem, 4vw, 2rem) clamp(1rem, 3.5vw, 1.35rem) 2.5rem;
    }

    .back {
      display: inline-block;
      color: var(--caramel-deep);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 700;
      margin-bottom: 1.35rem;
      letter-spacing: 0.02em;
    }

    .back:hover { text-decoration: underline; }

    .result-card {
      position: relative;
      background: linear-gradient(168deg, rgba(255, 255, 255, 0.82) 0%, rgba(250, 247, 242, 0.94) 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gold-line);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 28px 52px -24px rgba(61, 56, 52, 0.16);
      padding: clamp(1.85rem, 5vw, 2.35rem) clamp(1.35rem, 4vw, 1.85rem);
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: calc(var(--radius-lg) - 7px);
      border: 1px solid rgba(196, 165, 116, 0.18);
      pointer-events: none;
    }

    .pearls {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .pearls span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff 0%, #f0e8e0 40%, #d4ccc4 100%);
      box-shadow: 0 1px 2px rgba(61, 56, 52, 0.1), inset 0 -1px 1px rgba(139, 115, 85, 0.12);
    }

    .eyebrow {
      text-align: center;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--caramel);
      margin-bottom: 1rem;
    }

    .dim-badge {
      display: flex;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .dim-badge span {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.42rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(158, 184, 170, 0.45);
      background: rgba(255, 255, 255, 0.5);
      color: var(--caramel-deep);
    }

    .song-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.55rem, 6vw, 2.05rem);
      font-weight: 600;
      text-align: center;
      line-height: 1.22;
      color: var(--caramel-deep);
      margin-bottom: 0;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid rgba(196, 165, 116, 0.35);
    }

    .geo-split {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 1rem 0 1.1rem;
      opacity: 0.65;
    }

    .geo-split::before,
    .geo-split::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
      max-width: 4rem;
    }

    .geo-split i {
      font-style: normal;
      width: 5px;
      height: 5px;
      border: 1px solid rgba(196, 165, 116, 0.65);
      transform: rotate(45deg);
    }

    .persona {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.22rem, 4.2vw, 1.38rem);
      font-weight: 600;
      font-style: italic;
      text-align: center;
      color: var(--caramel-deep);
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }

    .blurb {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.82;
      color: rgba(61, 56, 52, 0.88);
      text-align: center;
      white-space: pre-line;
      margin-bottom: 0;
    }

    .lyric-block {
      text-align: center;
      margin: 1.35rem 0 0;
      padding: 0 0.25rem;
    }

    .lyric-block[hidden] {
      display: none !important;
    }

    .lyric-en {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(0.88rem, 3vw, 0.96rem);
      font-weight: 500;
      line-height: 1.55;
      color: rgba(61, 56, 52, 0.52);
      margin: 0;
      letter-spacing: 0.02em;
    }

    .footer-actions {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 16rem;
      padding: 0.88rem 1.35rem;
      font-family: "Nunito", sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1px solid transparent;
    }

    .btn--primary {
      color: var(--cream);
      background: linear-gradient(175deg, var(--caramel) 0%, var(--caramel-deep) 100%);
      border-color: rgba(196, 165, 116, 0.5);
      box-shadow: 0 12px 32px -10px rgba(109, 88, 68, 0.45);
    }

    .btn--ghost {
      color: var(--caramel-deep);
      background: rgba(255, 255, 255, 0.45);
      border-color: rgba(196, 165, 116, 0.38);
      font-weight: 700;
    }

    .btn:hover { transform: translateY(-1px); }

    .empty {
      text-align: center;
      padding: 2.5rem 1.25rem;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--ink-soft);
      background: linear-gradient(168deg, rgba(255, 255, 255, 0.72) 0%, rgba(250, 247, 242, 0.88) 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gold-line);
    }

    .empty a {
      color: var(--caramel-deep);
      font-weight: 700;
    }

    footer.note {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(61, 56, 52, 0.36);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <a class="back" href="index.html">← 返回首页</a>

    <div id="panel-empty" class="empty" hidden>
      <p>还没有作答记录。</p>
      <p style="margin-top:0.75rem"><a href="quiz.html">前往问卷</a></p>
    </div>

    <article id="panel-result" class="result-card" aria-live="polite" hidden>
      <div class="pearls" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="eyebrow">Your Soul Track</p>
      <div class="dim-badge"><span id="dim-label"></span></div>
      <h1 class="song-title" id="song-title"></h1>
      <div class="geo-split" aria-hidden="true"><i></i></div>
      <p class="persona" id="persona-line"></p>
      <p class="blurb" id="blurb"></p>
      <div class="lyric-block" id="lyric-block" hidden>
        <p class="lyric-en" id="lyric-en" lang="en"></p>
      </div>
      <div class="footer-actions">
        <a class="btn btn--primary" href="quiz.html?new=1">重新测试</a>
        <a class="btn btn--ghost" href="index.html">回到封面</a>
      </div>
    </article>

    <footer class="note">Fan quiz · not affiliated</footer>
  </div>

  <script>
    (function () {
      "use strict";

      var KEY = "lauver_quiz_v1";
      var TOTAL = 16;
      var CONFIG_URL = "songs-meta.json";

      var DIM_META = null;
      var SONGS_BY_DIM = null;
      var RESULT_META = null;

      var SUBQ = {
        A: [0, 2, 4, 6],
        B: [1, 3, 5, 7],
        C: [8, 9, 10, 11],
        D: [12, 13, 14, 15]
      };

      function applyConfig(data) {
        SONGS_BY_DIM = data.songsByDimension;
        RESULT_META = data.songCopy;
        DIM_META = {};
        ["A", "B", "C", "D"].forEach(function (k) {
          DIM_META[k] = { label: data.dimensionLabels[k] || k };
        });
      }

      function loadConfig() {
        return fetch(CONFIG_URL)
          .then(function (res) {
            if (!res.ok) throw new Error("http " + res.status);
            return res.json();
          })
          .then(function (data) {
            if (
              !data ||
              !data.songsByDimension ||
              !data.songCopy ||
              !data.dimensionLabels
            ) {
              throw new Error("invalid config");
            }
            applyConfig(data);
          });
      }

      function letterToIndex(ch) {
        return { A: 0, B: 1, C: 2, D: 3 }[ch];
      }

      function countDims(answers) {
        var c = { A: 0, B: 0, C: 0, D: 0 };
        for (var i = 0; i < answers.length; i++) {
          var x = answers[i];
          if (c[x] !== undefined) c[x]++;
        }
        return c;
      }

      function topDim(c) {
        var order = ["A", "B", "C", "D"];
        var max = Math.max(c.A, c.B, c.C, c.D);
        for (var i = 0; i < order.length; i++) {
          if (c[order[i]] === max) return order[i];
        }
        return "A";
      }

      function scoreSongsInDim(dim, answers) {
        var titles = SONGS_BY_DIM[dim];
        var n = titles.length;
        var scores = [];
        for (var t = 0; t < n; t++) scores[t] = 0;

        var qix = SUBQ[dim];
        for (var q = 0; q < qix.length; q++) {
          var qi = qix[q];
          var ch = answers[qi];
          var idx = letterToIndex(ch);
          if (idx === undefined) idx = 0;
          for (var s = 0; s < n; s++) {
            if (s < 4) scores[s] += s === idx ? 2 : 1;
            else scores[s] += 1;
          }
        }

        var best = 0;
        for (var b = 1; b < n; b++) {
          if (scores[b] > scores[best]) best = b;
        }
        return { song: titles[best], scores: scores, titles: titles };
      }

      function resolve(answers) {
        if (!answers || answers.length < TOTAL) return null;
        var c = countDims(answers);
        var dim = topDim(c);
        var inner = scoreSongsInDim(dim, answers);
        var meta = RESULT_META[inner.song] || {
          persona: "漫游人格",
          blurb: "你在漫游中寻找属于自己的旋律。",
          lyricEn: ""
        };
        return {
          dim: dim,
          dimLabel: DIM_META[dim].label,
          song: inner.song,
          persona: meta.persona,
          blurb: meta.blurb,
          lyricEn: meta.lyricEn || ""
        };
      }

      var answers = [];
      try {
        var raw = sessionStorage.getItem(KEY);
        if (raw) answers = JSON.parse(raw);
        if (!Array.isArray(answers) || answers.length < TOTAL) answers = [];
      } catch (e) {
        answers = [];
      }

      var panelEmpty = document.getElementById("panel-empty");
      var panelResult = document.getElementById("panel-result");

      if (answers.length < TOTAL) {
        panelEmpty.hidden = false;
        return;
      }

      function showResult(r) {
        panelResult.hidden = false;
        document.getElementById("dim-label").textContent = r.dimLabel;
        document.getElementById("song-title").textContent = r.song;
        document.getElementById("persona-line").textContent = r.persona;
        document.getElementById("blurb").textContent = r.blurb;

        var block = document.getElementById("lyric-block");
        var elEn = document.getElementById("lyric-en");
        var en = r.lyricEn || "";
        if (block && elEn) {
          if (en) {
            elEn.textContent = en;
            block.hidden = false;
          } else {
            elEn.textContent = "";
            block.hidden = true;
          }
        }
      }

      function showLoadError() {
        panelEmpty.hidden = false;
        var ps = panelEmpty.querySelectorAll("p");
        if (ps[0]) {
          ps[0].textContent =
            "无法加载配置文件 " +
            CONFIG_URL +
            "。请通过本地服务器打开（勿直接用 file://），或检查 JSON 是否存在且格式正确。";
        }
        if (ps[1]) {
          ps[1].innerHTML = '<a href="quiz.html">返回问卷</a>';
        }
      }

      loadConfig()
        .then(function () {
          var r = resolve(answers);
          if (!r) {
            panelEmpty.hidden = false;
            return;
          }
          showResult(r);
          try {
            if (r.song && RESULT_META[r.song]) {
              var statKey = "lauver_quiz_stat_sent:" + r.song;
              if (!sessionStorage.getItem(statKey)) {
                fetch("/api/laufey/complete", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ title: r.song }),
                  keepalive: true
                }).then(function (res) {
                  if (res.ok) sessionStorage.setItem(statKey, "1");
                }).catch(function () {});
              }
            }
          } catch (eStat) {}
        })
        .catch(function () {
          showLoadError();
        });
    })();
  </script>
</body>
</html>
