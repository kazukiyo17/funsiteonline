<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Laufey 24 曲巡演人格象限测试：奶油胶片质感 · 四维十六问。" />
  <title>Laufey Soul Spectrum｜人格主题曲测试</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf7f2;
      --cream-deep: #f3ebe3;
      --caramel: #8b7355;
      --caramel-deep: #6d5844;
      --peach: #e8c4b8;
      --peach-soft: rgba(232, 196, 184, 0.35);
      --mint: #9eb8aa;
      --mint-soft: rgba(158, 184, 170, 0.28);
      --gold: #c4a574;
      --gold-line: rgba(196, 165, 116, 0.45);
      --ink: #3d3834;
      --ink-soft: rgba(61, 56, 52, 0.62);
      --radius-lg: clamp(18px, 4vw, 24px);
      --radius-sm: 12px;
      --grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.09'/%3E%3C/svg%3E");
      --grain-fine: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)' opacity='0.045'/%3E%3C/svg%3E");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100dvh;
      font-family: "Nunito", system-ui, sans-serif;
      font-weight: 500;
      color: var(--ink);
      background-color: var(--cream-deep);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 95% 70% at 50% -8%, var(--peach-soft), transparent 58%),
        radial-gradient(ellipse 55% 42% at 110% 85%, var(--mint-soft), transparent 52%),
        radial-gradient(ellipse 50% 38% at -5% 55%, rgba(196, 165, 116, 0.12), transparent 48%),
        linear-gradient(168deg, var(--cream) 0%, var(--cream-deep) 48%, #ebe3d9 100%);
      filter: saturate(0.92) contrast(0.96);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        var(--grain),
        var(--grain-fine),
        repeating-linear-gradient(
          92deg,
          transparent 0,
          transparent 11px,
          rgba(107, 88, 68, 0.018) 11px,
          rgba(107, 88, 68, 0.018) 12px
        ),
        radial-gradient(ellipse 85% 75% at 50% 50%, transparent 40%, rgba(61, 56, 52, 0.06) 100%);
      opacity: 1;
    }

    .frame {
      position: relative;
      z-index: 2;
      max-width: 36rem;
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 2.75rem) clamp(1.25rem, 4vw, 2rem);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-card {
      position: relative;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.72) 0%, rgba(250, 247, 242, 0.88) 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gold-line);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.85) inset,
        0 28px 56px -24px rgba(61, 56, 52, 0.18),
        0 12px 32px -18px rgba(139, 115, 85, 0.12);
      padding: clamp(2rem, 5vw, 2.75rem) clamp(1.5rem, 4vw, 2.25rem);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: calc(var(--radius-lg) - 8px);
      border: 1px solid rgba(196, 165, 116, 0.2);
      pointer-events: none;
    }

    .pearls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .pearls span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff 0%, #f0e8e0 35%, #d4ccc4 100%);
      box-shadow:
        0 1px 2px rgba(61, 56, 52, 0.12),
        inset 0 -1px 1px rgba(139, 115, 85, 0.15);
    }

    .eyebrow {
      text-align: center;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--caramel);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.35rem, 9vw, 3.25rem);
      font-weight: 600;
      line-height: 1.08;
      text-align: center;
      letter-spacing: 0.02em;
      color: var(--caramel-deep);
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.125rem;
      text-align: center;
      color: var(--mint);
      margin-bottom: 1.5rem;
    }

    .geo-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
      opacity: 0.75;
    }

    .geo-divider::before,
    .geo-divider::after {
      content: "";
      flex: 1;
      max-width: 5rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-line), transparent);
    }

    .geo-divider i {
      font-style: normal;
      width: 6px;
      height: 6px;
      border: 1px solid var(--gold);
      transform: rotate(45deg);
      opacity: 0.65;
    }

    .copy {
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.85;
      color: var(--ink-soft);
      margin-bottom: 1.65rem;
      text-align: center;
      max-width: 26rem;
      margin-left: auto;
      margin-right: auto;
    }

    .copy--lead {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.05rem, 3.2vw, 1.2rem);
      font-weight: 500;
      line-height: 2;
      letter-spacing: 0.04em;
      color: rgba(61, 56, 52, 0.78);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .pill {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(158, 184, 170, 0.45);
      background: rgba(255, 255, 255, 0.45);
      color: var(--caramel-deep);
    }

    .cta-wrap {
      text-align: center;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.95rem 2rem;
      font-family: "Nunito", sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      color: var(--cream);
      background: linear-gradient(175deg, var(--caramel) 0%, var(--caramel-deep) 100%);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(196, 165, 116, 0.55);
      box-shadow:
        0 2px 0 rgba(61, 56, 52, 0.08),
        0 14px 36px -12px rgba(109, 88, 68, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow:
        0 4px 0 rgba(61, 56, 52, 0.06),
        0 20px 44px -14px rgba(109, 88, 68, 0.38);
    }

    .cta:active {
      transform: translateY(0);
    }

    .fine {
      margin-top: 1.35rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--ink-soft);
      text-align: center;
      line-height: 1.6;
    }

    .fine a {
      color: var(--caramel-deep);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer {
      margin-top: 2.25rem;
      text-align: center;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(61, 56, 52, 0.38);
    }

    @media (prefers-reduced-motion: reduce) {
      .cta:hover { transform: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <article class="hero-card" aria-labelledby="hero-title">
      <div class="pearls" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="eyebrow">Soul Spectrum · 人格主题曲</p>
      <h1 id="hero-title">Laufey<br />Soul Spectrum</h1>
      <p class="subtitle">四维人格 · 一曲定局</p>
      <div class="geo-divider" aria-hidden="true"><i></i></div>
      <p class="copy copy--lead">
        循着爵士慵懒步调<br />
        剖白内在性格<br />
        找到你的灵魂代表曲
      </p>
      <div class="pill-row" aria-label="测试维度">
        <span class="pill">怀旧沉溺</span>
        <span class="pill">浪漫理想</span>
        <span class="pill">秩序克制</span>
        <span class="pill">自我觉醒</span>
      </div>
      <div class="cta-wrap">
        <a class="cta" href="quiz.html">进入问卷</a>
      </div>
      <p class="fine">已完成测试？<a href="result.html">查看结果</a>（需同一会话内作答）</p>
    </article>
    <footer>Laufey fan quiz · not affiliated</footer>
  </div>
</body>
</html>
