<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>共鸣测试 · Fear and Dreams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Inter:wght@300;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      /* 参考 FEAR and DREAMS 海报：深底 + 高饱和花簇 */
      --bg: #000000;
      --royal: #5b1b7a;
      --lavender-mist: #b39ddb;
      --magenta: #b34fb8;
      --blush: #f8bbd9;
      --hot-pink: #e91e8c;
      --hydrangea-blue: #1e5fd4;
      --coral-ember: #e85d3a;
      --crimson: #9d1b3a;
      --billy: #f5d64a;
      --foliar: #1a4d1f;
      --white: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    #hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse 80% 60% at 50% 100%, #1a0a1a 0%, var(--bg) 55%);
      overflow: hidden;
    }

    #bloom-field {
      position: absolute;
      inset: 0;
    }

    /* 花卉容器：扁平化单文件，无花影、无 3D */
    .flw {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .flw--flat {
      width: 100px;
      height: 100px;
    }

    /* 花型 1、5：小花 */
    .flw--sm {
      width: 52px;
      height: 52px;
    }

    .flw--sm .ff1-center {
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
    }

    .flw--sm .ff1-dots {
      width: 2px;
      height: 2px;
      margin: -1px 0 0 -1px;
    }

    /* 花型 4：大花（较默认约 1.35 倍） */
    .flw--lg {
      width: 135px;
      height: 135px;
    }

    .ff4.ff4--lg .ff4-main {
      width: 70px;
      height: 70px;
      margin: -35px 0 0 -35px;
    }

    .ff4.ff4--lg .ff4-bump {
      width: 27px;
      height: 27px;
      margin: -13.5px 0 0 -13.5px;
    }

    .ff4.ff4--lg .ff4-bump0  { --bump-tf: translate(0, -38px); }
    .ff4.ff4--lg .ff4-bump1  { --bump-tf: translate(27px, -27px) rotate(45deg); }
    .ff4.ff4--lg .ff4-bump2  { --bump-tf: translate(38px, 0) rotate(90deg); }
    .ff4.ff4--lg .ff4-bump3  { --bump-tf: translate(27px, 27px) rotate(135deg); }
    .ff4.ff4--lg .ff4-bump4  { --bump-tf: translate(0, 38px) rotate(180deg); }
    .ff4.ff4--lg .ff4-bump5  { --bump-tf: translate(-27px, 27px) rotate(225deg); }
    .ff4.ff4--lg .ff4-bump6  { --bump-tf: translate(-38px, 0) rotate(270deg); }
    .ff4.ff4--lg .ff4-bump7  { --bump-tf: translate(-27px, -27px) rotate(315deg); }

    .ff4.ff4--lg .ff4-core {
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
    }

    .ff4.ff4--lg .ff4-hair {
      width: 3px;
      height: 11px;
      margin-top: -6px;
      margin-left: -1.5px;
    }

    .ff {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* 放射花瓣通用：长条圆角，自花心向外 */
    .ff--rad {
      position: absolute;
      left: 50%;
      top: 8%;
      width: 8%;
      min-width: 5px;
      height: 40%;
      margin-left: -4px;
      border-radius: 999px;
      transform-origin: 50% calc(100% + 18px);
      opacity: 0;
    }

    @keyframes flat-radial {
      0% {
        opacity: 0;
        transform: rotate(var(--r, 0deg)) scaleY(0) scaleX(0.2);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--r, 0deg)) scaleY(1) scaleX(1);
      }
    }

    @keyframes flat-pop {
      0% { opacity: 0; transform: scale(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes flat-bn {
      0% { opacity: 0; transform: var(--bump-tf) scale(0.25); }
      100% { opacity: 1; transform: var(--bump-tf) scale(1); }
    }

    @keyframes flat-hair {
      0% { opacity: 0; transform: rotate(var(--a, 0deg)) translate3d(0, 0, 0) scale(0, 0.3); }
      100% { opacity: 1; transform: rotate(var(--a, 0deg)) translate3d(0, -5px, 0) scale(1, 1); }
    }

    /* 1. 星形花：6 长瓣 + 小花心 */
    .ff1-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      z-index: 2;
      opacity: 0;
    }

    .ff1-dots {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      z-index: 3;
    }

    /* 3. 五瓣 + 白圆心 */
    .ff3-ptl {
      position: absolute;
      left: 50%;
      top: 18%;
      width: 32%;
      height: 32%;
      margin-left: -16%;
      border-radius: 50%;
      transform-origin: 50% 120%;
      opacity: 0;
    }

    @keyframes flat-five {
      0% {
        opacity: 0;
        transform: rotate(var(--r, 0deg)) scale(0);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--r, 0deg)) scale(1);
      }
    }

    .ff3-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      background: #fafafa;
      border-radius: 50%;
      z-index: 2;
      opacity: 0;
    }

    /* 4. 扇形/波浪边花：大圆 + 8 个外缘圆叠成花边 + 红芯 + 白线蕊 */
    .ff4 {
      position: relative;
    }

    .ff4-main {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      border-radius: 50%;
      z-index: 0;
      opacity: 0;
    }

    .ff4-bump {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      z-index: 0;
      transform: var(--bump-tf) scale(1);
      opacity: 0;
    }

    .ff4-bump0  { --bump-tf: translate(0, -28px); }
    .ff4-bump1  { --bump-tf: translate(20px, -20px) rotate(45deg); }
    .ff4-bump2  { --bump-tf: translate(28px, 0) rotate(90deg); }
    .ff4-bump3  { --bump-tf: translate(20px, 20px) rotate(135deg); }
    .ff4-bump4  { --bump-tf: translate(0, 28px) rotate(180deg); }
    .ff4-bump5  { --bump-tf: translate(-20px, 20px) rotate(225deg); }
    .ff4-bump6  { --bump-tf: translate(-28px, 0) rotate(270deg); }
    .ff4-bump7  { --bump-tf: translate(-20px, -20px) rotate(315deg); }

    .ff4-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      z-index: 1;
      opacity: 0;
    }

    .ff4-hair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 8px;
      margin-top: -6px;
      margin-left: -1px;
      background: #fafafa;
      border-radius: 1px;
      z-index: 1;
      transform-origin: 50% 100%;
      opacity: 0;
    }

    /* 5. 小雏菊：短条瓣 + 白心（画板为 flw--sm，整体为小花） */
    .ff5-ptl {
      position: absolute;
      left: 50%;
      top: 20%;
      width: 5%;
      min-width: 3px;
      height: 32%;
      margin-left: -2.5px;
      border-radius: 999px;
      transform-origin: 50% calc(100% + 10px);
      opacity: 0;
    }

    .ff5-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      background: #fafafa;
      border-radius: 50%;
      z-index: 2;
      opacity: 0;
    }

    /* 主文案区：整列垂直居中（等效设计稿中轴布局） */
    .hero-copy {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: min(34rem, 92vw);
      padding: 1.5rem 1.25rem;
      pointer-events: auto;
    }

    .title-line-1 {
      display: block;
    }

    .fear {
      font-family: "Cinzel", "Times New Roman", serif;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.35em;
      color: var(--white);
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow:
        0 0.06em 0 #1e1b4b,
        0 0.12em 0 rgba(255, 255, 255, 0.12),
        0 0.2em 0.35em rgba(0, 0, 0, 0.85),
        0.08em 0.25em 0.15em rgba(0, 0, 0, 0.5);
      filter: url(#drip-rough);
      animation: title-fade 1.4s ease 0.3s both;
    }

    .and-connector {
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.1rem, 3.5vw, 1.65rem);
      color: #f5a0c4;
      margin: 0.12em 0 0.08em;
      text-shadow: 0 0 20px rgba(236, 72, 153, 0.45);
      animation: title-fade 1.2s ease 0.6s both;
    }

    .dreams {
      font-family: "Cinzel", "Times New Roman", serif;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 400;
      letter-spacing: 0.2em;
      color: #fefefe;
      text-transform: uppercase;
      line-height: 1.2;
      text-shadow:
        0 0 0.5em rgba(255, 255, 255, 0.65),
        0 0 1em rgba(200, 180, 255, 0.35),
        0.03em 0.08em 0.1em rgba(0, 0, 0, 0.4);
      filter: blur(0.25px);
      animation: title-fade 1.4s ease 0.9s both, dreams-float 4s ease-in-out 1.2s infinite;
    }

    @keyframes title-fade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dreams-float {
      0%, 100% { filter: blur(0.25px); }
      50% { filter: blur(0.4px) brightness(1.05); }
    }

    .hero-sub {
      font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
      font-size: clamp(0.8rem, 1.6vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: rgba(255, 255, 255, 0.98);
      margin: 0.6rem 0 0.75rem;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.92),
        0 2px 10px rgba(0, 0, 0, 0.55),
        0 0 24px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(200, 140, 200, 0.35);
      animation: title-fade 0.9s ease 0.9s both;
    }

    .intro {
      width: 100%;
      text-align: center;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(0.82rem, 1.55vw, 0.95rem);
      font-weight: 500;
      line-height: 1.9;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.95);
      margin: 0 0 1.25rem;
    }

    .intro p + p {
      margin-top: 0.75em;
    }

    .intro p {
      max-width: 32em;
      margin-left: auto;
      margin-right: auto;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.95),
        0 2px 8px rgba(0, 0, 0, 0.55),
        0 0 20px rgba(0, 0, 0, 0.35);
      animation: title-fade 0.85s ease both;
    }

    .intro p:nth-of-type(1) { animation-delay: 1.1s; }
    .intro p:nth-of-type(2) { animation-delay: 1.25s; }
    .intro p:nth-of-type(3) { animation-delay: 1.4s; }

    /* 200×60 圆角 30 · 近白底 + 浅灰光泽 + 白色柔影 */
    a.cta-btn {
      text-decoration: none;
      color: inherit;
    }

    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 200px;
      height: 60px;
      margin-top: 0.25rem;
      padding: 0;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      /* 底色 ≈ (0.98,0.98,0.98) 叠浅灰斜向光泽 */
      background: linear-gradient(168deg, #fcfcfc 0%, #f0f0f0 40%, #e4e4e4 100%);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.65) inset,
        0 4px 8px rgba(255, 255, 255, 0.2);
      animation: title-fade 0.8s ease 1.5s both;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .cta-btn:hover {
      filter: brightness(1.04);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.75) inset,
        0 5px 10px rgba(255, 255, 255, 0.22);
    }

    .cta-btn:active {
      transform: scale(0.98);
    }

    .cta-btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.5);
      outline-offset: 3px;
    }

    .cta-btn__text {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 24px;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      color: rgb(20, 20, 20);
    }

    .social-strip {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.35rem 0.65rem;
      margin-top: 1.35rem;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.5);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      animation: title-fade 0.85s ease 1.65s both;
    }

    .social-strip__line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      white-space: nowrap;
    }

    .social-strip__icon {
      width: 1.05em;
      height: 1.05em;
      flex-shrink: 0;
      opacity: 0.92;
    }

    .social-strip__line--xhs .social-strip__icon {
      color: #fda4af;
    }

    .social-strip__line--douyin .social-strip__icon {
      color: #7dd3fc;
    }

    .social-strip__sep {
      color: rgba(255, 255, 255, 0.35);
      font-weight: 400;
      user-select: none;
      padding: 0 0.1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      @keyframes flat-radial {
        from, to { opacity: 1; transform: rotate(var(--r, 0deg)) scaleY(1) scaleX(1); }
      }
      @keyframes flat-five {
        from, to { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); }
      }
      @keyframes flat-pop {
        from, to { opacity: 1; transform: scale(1); }
      }
      @keyframes flat-hair {
        from, to { opacity: 1; transform: rotate(var(--a, 0deg)) translate3d(0, -5px, 0) scale(1, 1); }
      }
      @keyframes flat-bn {
        from, to { opacity: 1; transform: var(--bump-tf) scale(1); }
      }
      .dreams { animation: title-fade 0.5s ease both; }
      .intro p, .hero-sub, .cta-btn, .social-strip { animation: title-fade 0.45s ease both; opacity: 1; }
    }
  </style>
</head>
<body>
  <section id="hero" aria-label="花绽首屏">
    <div id="bloom-field" aria-hidden="true"></div>

    <svg class="visually-hidden" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <filter id="drip-rough" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <header class="hero-copy" lang="zh-Hans">
      <h1 class="visually-hidden">Fear and Dreams</h1>
      <div class="title-line-1" aria-hidden="true">
        <span class="fear">Fear</span>
        <p class="and-connector">and</p>
        <span class="dreams">Dreams</span>
      </div>
      <p class="hero-sub">共鸣测试</p>
      <div class="intro">
        <p>我们终其一生，游走在恐惧与梦想的两端</p>
        <p>一边被遗憾、不安、孤独裹挟，一边抱着执念、热爱、隐秘的期盼</p>
        <p>以Fear and Dreams 的宇宙为序，解锁藏在你的人格底色，看见你的怯懦与浪漫、挣扎与理想</p>
      </div>
      <a href="quiz.html" class="cta-btn" role="button" aria-label="进入测试">
        <span class="cta-btn__text">进入测试</span>
      </a>
      <div class="social-strip" aria-label="作者社交账号">
        <span class="social-strip__line social-strip__line--xhs">
          <svg class="social-strip__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H6V4h5v7l2.5-1.5L16 11V4h2v16z"/>
          </svg>
          <span>No, But?</span>
        </span>
        <span class="social-strip__sep" aria-hidden="true">·</span>
        <span class="social-strip__line social-strip__line--douyin">
          <svg class="social-strip__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
          <span>泥莫斯叭</span>
        </span>
      </div>
    </header>
  </section>

  <script>
    (function () {
      "use strict";

      var field = document.getElementById("bloom-field");
      if (!field) return;

      var palette = {
        royal: ["#4a148c", "#5b1b7a", "#6a1b9a", "#7b1fa2", "#4e1480"],
        lavender: ["#b39ddb", "#b794d6", "#c5a3e6", "#c9a0dc", "#ce93d8"],
        mag: ["#9c27b0", "#8e24aa", "#b34fb8", "#d500f9", "#ab47bc"],
        pinks: ["#fce4ec", "#f8bbd9", "#f48fb1", "#f06292", "#e91e63"],
        hydrangea: ["#0d47a1", "#1565c0", "#1e5fd4", "#2962ff", "#1e88e5"],
        crimson: ["#880e4f", "#9d1b3a", "#b71c1c", "#c2185b", "#ad1457"],
        coral: ["#e85d3a", "#ff7043", "#d84315", "#f4511e", "#e64a19"],
        billy: ["#f5d64a", "#ffee58", "#ffeb3b", "#fff176", "#ffd54f"],
        foliar: ["#1a4d1f", "#1b5e20", "#2e7d32", "#0d3312"]
      };

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      var reduced =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function setAnim(el, name, dur, delay, ease) {
        if (reduced) return;
        el.style.animationName = name;
        el.style.animationDuration = dur;
        el.style.animationDelay = delay;
        el.style.animationFillMode = "forwards";
        el.style.animationTimingFunction = ease || "cubic-bezier(0.22, 0.8, 0.25, 1)";
      }

      function wrapFlw(inner, kind) {
        var w = document.createElement("div");
        w.className = "flw flw--flat" + (kind || "");
        w.appendChild(inner);
        return w;
      }

      function f1LavenderStar() {
        var box = document.createElement("div");
        box.className = "ff";
        var skin = [palette.lavender, palette.royal, palette.mag];
        var petalC = pick(pick(skin));
        var d = 0;
        for (var i = 0; i < 6; i++) {
          var p = document.createElement("div");
          p.className = "ff--rad";
          p.style.background = petalC;
          p.style.setProperty("--r", 60 * i + "deg");
          d += 0.04 + Math.random() * 0.05;
          setAnim(p, "flat-radial", (0.45 + Math.random() * 0.2).toFixed(2) + "s", d.toFixed(2) + "s");
          box.appendChild(p);
        }
        var c = document.createElement("div");
        c.className = "ff1-center";
        c.style.background = Math.random() > 0.45 ? pick(palette.billy) : pick(palette.foliar);
        setAnim(c, "flat-pop", "0.3s", (d + 0.05).toFixed(2) + "s");
        box.appendChild(c);
        var dot = document.createElement("div");
        dot.className = "ff1-dots";
        dot.style.background = pick(palette.mag);
        setAnim(dot, "flat-pop", "0.2s", (d + 0.2).toFixed(2) + "s");
        box.appendChild(dot);
        return wrapFlw(box, " flw--sm");
      }

      function f3PinkBlossom() {
        var box = document.createElement("div");
        box.className = "ff";
        var col = pick(palette.pinks);
        if (Math.random() > 0.65) {
          col = pick(palette.mag);
        }
        var d = 0;
        for (var i = 0; i < 5; i++) {
          var p = document.createElement("div");
          p.className = "ff3-ptl";
          p.style.background = col;
          p.style.setProperty("--r", 72 * i + "deg");
          d += 0.05 + Math.random() * 0.04;
          setAnim(p, "flat-five", (0.4 + Math.random() * 0.15).toFixed(2) + "s", d.toFixed(2) + "s");
          box.appendChild(p);
        }
        var core = document.createElement("div");
        core.className = "ff3-core";
        setAnim(core, "flat-pop", "0.3s", (d + 0.1).toFixed(2) + "s");
        box.appendChild(core);
        return wrapFlw(box);
      }

      function f4BlueScallop() {
        var box = document.createElement("div");
        box.className = "ff ff4 ff4--lg";
        var blue = pick(palette.hydrangea);
        var main = document.createElement("div");
        main.className = "ff4-main";
        main.style.background = blue;
        setAnim(main, "flat-pop", (0.35 + Math.random() * 0.1).toFixed(2) + "s", "0s");
        box.appendChild(main);
        for (var b = 0; b < 8; b++) {
          var u = document.createElement("div");
          u.className = "ff4-bump ff4-bump" + b;
          u.style.background = blue;
          setAnim(
            u,
            "flat-bn",
            (0.4 + Math.random() * 0.1).toFixed(2) + "s",
            (0.04 * b + Math.random() * 0.05).toFixed(2) + "s"
          );
          box.appendChild(u);
        }
        var core = document.createElement("div");
        core.className = "ff4-core";
        core.style.background = pick(palette.crimson);
        setAnim(core, "flat-pop", "0.25s", "0.35s");
        box.appendChild(core);
        for (var h = 0; h < 6; h++) {
          var hair = document.createElement("div");
          hair.className = "ff4-hair";
          hair.style.setProperty("--a", 60 * h + "deg");
          setAnim(hair, "flat-hair", (0.25 + Math.random() * 0.1).toFixed(2) + "s", (0.3 + h * 0.04).toFixed(2) + "s");
          box.appendChild(hair);
        }
        return wrapFlw(box, " flw--lg");
      }

      function f5PeachDaisy() {
        var box = document.createElement("div");
        box.className = "ff";
        var pools5 = [palette.coral, palette.pinks, palette.lavender, palette.billy];
        var col = pick(pick(pools5));
        var d = 0;
        for (var i = 0; i < 12; i++) {
          var p = document.createElement("div");
          p.className = "ff5-ptl";
          p.style.background = col;
          p.style.setProperty("--r", 30 * i + "deg");
          d += 0.025 + Math.random() * 0.02;
          setAnim(p, "flat-radial", (0.4 + Math.random() * 0.1).toFixed(2) + "s", d.toFixed(2) + "s");
          box.appendChild(p);
        }
        var c = document.createElement("div");
        c.className = "ff5-core";
        setAnim(c, "flat-pop", "0.3s", (d + 0.08).toFixed(2) + "s");
        box.appendChild(c);
        return wrapFlw(box, " flw--sm");
      }

      var makers = [f1LavenderStar, f3PinkBlossom, f4BlueScallop, f5PeachDaisy];

      function nextMaker() {
        return makers[Math.floor(Math.random() * makers.length)];
      }

      var count = Math.min(52, Math.max(32, Math.floor((window.innerWidth * window.innerHeight) / 16000)));

      for (var f = 0; f < count; f++) {
        var el = nextMaker()();
        el.style.left = rand(4, 96) + "%";
        el.style.top = rand(4, 96) + "%";
        el.style.zIndex = String(10 + Math.floor(Math.random() * 100));
        var sc = 0.5 + Math.random() * 0.85;
        if (el.className.indexOf("flw--sm") !== -1) {
          sc = 0.4 + Math.random() * 0.4;
        } else if (el.className.indexOf("flw--lg") !== -1) {
          sc = 0.82 + Math.random() * 0.4;
        }
        el.style.transform =
          "translate(-50%, -50%) scale(" + sc.toFixed(2) + ") rotate(" + rand(-12, 12) + "deg)";
        field.appendChild(el);
      }
    })();
  </script>
</body>
</html>
