  <style>
    :root {
      --bg: #050508;
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.6);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #c084fc;
      --danger: #f43f5e;
      --card: rgba(20, 16, 28, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      background-image: radial-gradient(ellipse 90% 70% at 50% 0%, #1a1025 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 32rem;
      margin: 0 auto;
      padding: 1rem 1.15rem 2rem;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
    }

    .back:hover { color: #fff; }

    .count {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .count strong {
      color: #fff;
      font-weight: 600;
    }

    .bar-wrap {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-bottom: 1.75rem;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7c3aed, #c084fc, #f0abfc);
      transition: width 0.35s ease;
    }

    .q-head {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .q-stem {
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.65;
      margin-bottom: 1.5rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.9rem 1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }

    .opt:hover {
      border-color: rgba(192, 132, 252, 0.45);
      background: rgba(32, 26, 45, 0.85);
    }

    .opt:active { transform: scale(0.99); }

    .opt .k {
      display: inline-block;
      width: 1.4rem;
      font-weight: 600;
      color: var(--accent);
      margin-right: 0.25rem;
    }

    .opt .dim {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .nav-row {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-ghost {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.875rem;
      cursor: pointer;
      font-family: inherit;
      padding: 0.5rem 0.25rem;
    }

    .btn-ghost:hover { color: #fff; }
    .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

    .panel { flex: 1; display: flex; flex-direction: column; }
    [hidden] { display: none !important; }

    .panel.done {
      text-align: center;
      align-items: stretch;
      max-width: 100%;
    }

    .share-wrap {
      width: 100%;
      max-width: 24rem;
      margin: 0.25rem auto 0;
    }

    .share-card {
      position: relative;
      text-align: center;
      padding: 1.6rem 1.35rem 1.4rem;
      border-radius: 1.15rem;
      background:
        linear-gradient(165deg, rgba(60, 42, 88, 0.32) 0%, rgba(18, 14, 28, 0.7) 55%, rgba(8, 7, 14, 0.9) 100%),
        radial-gradient(100% 80% at 50% -20%, rgba(120, 80, 200, 0.18) 0%, transparent 50%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 0 0 1px rgba(200, 170, 255, 0.06) inset,
        0 24px 48px -12px rgba(0, 0, 0, 0.55),
        0 0 64px -20px rgba(124, 58, 237, 0.2);
    }

    .share-card::before {
      content: "";
      position: absolute;
      left: 1.5rem;
      right: 1.5rem;
      top: 0.5rem;
      height: 2px;
      border-radius: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 170, 255, 0.4), rgba(196, 132, 252, 0.2), transparent);
      opacity: 0.7;
    }

    .share-card__brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      margin-bottom: 1.1rem;
    }

    .share-card__eyebrow {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.4);
    }

    .share-card__sub {
      font-size: 0.78rem;
      color: rgba(200, 180, 255, 0.55);
      letter-spacing: 0.35em;
    }

    .result-lead {
      font-size: 0.9rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.18em;
      margin: 0 0 0.9rem;
    }

    .result-song {
      font-size: clamp(1.55rem, 5.2vw, 2.05rem);
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
      letter-spacing: 0.1em;
      margin: 0 0 1.35rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-shadow:
        0 0 40px rgba(200, 160, 255, 0.45),
        0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .result-rail {
      text-align: left;
      max-width: 20rem;
      margin: 0 auto;
      padding: 0 0 0 0.9rem;
      border-left: 2px solid rgba(167, 139, 250, 0.45);
    }

    .result-personality {
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1.5;
      color: #f3e8ff;
      margin: 0 0 0.85rem;
    }

    .result-copy {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.58);
      margin: 0;
      white-space: pre-line;
    }

    .share-hint {
      font-size: 0.78rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.4);
      margin: 1.4rem 0 0.15rem;
      padding-top: 1.1rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      letter-spacing: 0.04em;
    }

    .done-footer {
      margin-top: 1.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
    }

    .done-footer .opt {
      max-width: 220px;
    }

    @keyframes shareCardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .panel.done[hidden] .share-card { animation: none; }
      .panel.done:not([hidden]) .share-card { animation: shareCardIn 0.55s ease both; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar-fill { transition: none; }
    }

      margin-top: 2rem;
      padding-top: 0.5rem;

      font-size: 0.75rem;
      font-weight: 500;

      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;

      justify-content: center;
      gap: 0.45rem;

      color: #fda4af;
    }

      color: #7dd3fc;
    }

    .quiz-social__sep {
      color: rgba(255, 255, 255, 0.28);
      user-select: none;
      padding: 0 0.05rem;
    }
  </style>
</head>

        ]},
        { text: "理想的生活状态，你更向往？", options: [
          { key: "A", label: "安静低欲望，不被外界打扰", dim: "Hp", tag: "Helpless" },
          { key: "B", label: "平淡安稳，不再被感情内耗", dim: "Hs", tag: "Hopeless" },
          { key: "C", label: "随性自由，怎么舒服怎么来", dim: "Rs", tag: "Restless" },
          { key: "D", label: "岁岁平安，日子温柔又有盼头", dim: "Db", tag: "Doubtless" }
        ]}
      ];

      var elStem = document.getElementById("q-stem");
      var elOpts = document.getElementById("q-opts");
      var elNum = document.getElementById("q-num");
      var elBar = document.getElementById("q-bar");
      var elPrev = document.getElementById("btn-prev");
      var elProg = document.getElementById("q-progress-wrap");
      var quizPanel = document.getElementById("quiz-panel");
      var donePanel = document.getElementById("done-panel");
      var btnRestart = document.getElementById("btn-restart");

      var answers = [];
      try {
        var raw = sessionStorage.getItem(KEY);
        if (raw) answers = JSON.parse(raw);
        if (!Array.isArray(answers) || answers.length > TOTAL) answers = [];
      } catch (e) { answers = []; }

      if (typeof location.search === "string" && /[?&]new=1(?:&|$)/.test(location.search)) {
        try {
          sessionStorage.removeItem(KEY);
          localStorage.removeItem("fnd_quiz_last_result_v1");
        } catch (e2) {}
        answers = [];
        if (typeof history.replaceState === "function") {
          history.replaceState(null, "", location.pathname || "quiz.html");
        }
      }

      var idx = answers.length;

      function save() {
        try {
          sessionStorage.setItem(KEY, JSON.stringify(answers));
        } catch (e) {}
      }

      function setProgress(n) {
        var cur = n + 1;
        if (elNum) elNum.textContent = String(cur);
        if (elBar) elBar.style.width = (cur / TOTAL) * 100 + "%";
        if (elProg) {
          elProg.setAttribute("aria-valuenow", String(cur));
          elProg.setAttribute("aria-valuetext", "第 " + cur + " 题，共 " + TOTAL + " 题");
        }
        if (elPrev) elPrev.disabled = n <= 0;
      }

      function render() {
        if (idx < 0) idx = 0;
        if (idx >= TOTAL) {
          showDone();
          return;
        }
        var q = QUIZ[idx];
        setProgress(idx);
        if (elStem) elStem.textContent = (idx + 1) + ". " + q.text;
        elOpts.innerHTML = "";
        q.options.forEach(function (o) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt";
          btn.setAttribute("role", "option");
          var spanK = document.createElement("span");
          spanK.className = "k";
          spanK.textContent = o.key + ".";
          btn.appendChild(spanK);
          btn.appendChild(document.createTextNode(" " + o.label));
          var small = document.createElement("span");
          small.className = "dim";
          small.textContent = "「" + o.tag + "」";
          btn.appendChild(small);
          btn.addEventListener("click", function () { pick(o); });
          elOpts.appendChild(btn);
        });
      }

      function pick(o) {
        answers[idx] = o.dim;
        save();
        idx += 1;
        if (idx >= TOTAL) {
          showDone();
          return;
        }
        render();
        window.scrollTo(0, 0);
      }

      function goPrev() {
        if (idx <= 0) return;
        idx -= 1;
        answers.pop();
        save();
        render();
        window.scrollTo(0, 0);
      }

      if (elPrev) elPrev.addEventListener("click", goPrev);

      if (btnRestart) {
        btnRestart.addEventListener("click", function () {
          try {
            sessionStorage.removeItem(KEY);
          } catch (e) {}
          try {
            localStorage.removeItem("fnd_quiz_last_result_v1");
          } catch (e2) {}
          location.href = "quiz.html?new=1";
        });
      }

      var SONGS = {
        Hp: ["2001太空漫游", "人神斗", "当这地球没有花", "时代巨轮"],
        Hs: ["兄妹", "心的距离", "我们", "红玫瑰"],
        Rs: ["告别娑婆", "完", "好久不见", "任我行"],
        Db: ["人生马拉松", "陪你度过漫长岁月", "路一直都在", "我们万岁"]
      };
      var RESULT_META = {
        "2001太空漫游": { p: "宇宙疏离者", t: "困在无垠宇宙的失重里，与人间保持永久的距离。\n世间热闹皆与你无关，生来便习惯独自沉默漂浮。" },
        人神斗: { p: "清醒局外人", t: "看尽世俗博弈与人情凉薄，一半冷眼观世，一半被迫妥协。\n你清醒地挣扎，在人性与现实之间孤身对峙。" },
        当这地球没有花: { p: "荒芜悲观者", t: "温柔尽数凋零，浪漫归于沉寂。\n你见过世间荒芜的本质，从此对所有美好都不敢笃定。" },
        时代巨轮: { p: "洪流失语者", t: "被时代巨轮推着前行，身不由己，无力反抗。\n藏起自我，淹没在人海浪潮里，安静随波逐流。" },
        黑洞: { p: "深度压抑者", t: "情绪坠入无边黑洞，暗潮向内吞噬所有光亮。\n外表平静如常，内里早已困在无尽的荒芜深渊。" },
        兄妹: { p: "暧昧困局者", t: "爱不得，舍不得，跨不过界限，走不近彼此。\n所有深情止于名分，是克制一生的意难平。" },
        心的距离: { p: "情感隔阂者", t: "明明近在咫尺，心却隔着万水千山。\n爱意慢慢降温，隔阂生根，再也无法同频相拥。" },
        我们: { p: "旧梦沉溺者", t: "后来没有我们，只剩回忆反复拉扯。\n年少遗憾封存在过往，余生只剩怀念与沉默。" },
        红玫瑰: { p: "执念深情者", t: "得不到的永远难忘，意难平贯穿岁岁年年。\n温柔予人，遗憾自留，习惯性为爱内耗。" },
        异梦: { p: "同床异梦者", t: "身在人间相伴，灵魂各自漂泊在不同梦境。\n看似安稳同行，实则从来无人真正懂你。" },
        告别娑婆: { p: "尘世逃离者", t: "厌倦人间娑婆纷扰，总想挣脱世俗枷锁。\n在破碎与清醒间反复徘徊，渴望逃离一切束缚。" },
        完: { p: "破碎自愈者", t: "一切走向落幕，情绪崩塌，生活归于荒芜。\n在绝境里独自蜷缩，慢慢消化所有崩塌与残缺。" },
        好久不见: { p: "念旧独行者", t: "揣着旧人旧事安静前行，不打扰，不回望。\n温柔封存过往，只在某个瞬间，悄悄怀念从前。" },
        任我行: { p: "自由独行客", t: "曾惧怕孤单，终学会一个人独行山河。\n看淡合群与热闹，独行于世，亦是一种圆满自在。" },
        大人: { p: "成长通透者", t: "褪去年少莽撞，学会隐忍、包容、温柔自持。\n与生活握手言和，安静成为成熟且温柔的大人。" },
        七百年后: { p: "岁月温柔者", t: "跨越漫长时光，爱意与温柔永不褪色。\n看淡短暂得失，以长久的温柔，对抗人间无常。" },
        人生马拉松: { p: "坚韧前行者", t: "人生是一场漫长长跑，不必急于抵达终点。\n步履缓慢却坚定，熬过低谷，终会遇见回甘。" },
        陪你度过漫长岁月: { p: "治愈陪伴者", t: "岁月漫长，风雨起落，总有人与你并肩。\n温柔接纳所有无常，在时光里慢慢安稳生长。" },
        路一直都在: { p: "向阳前行者", t: "纵有迷雾与低谷，前路永远绵延向前。\n不惧坎坷，心怀坦荡，永远奔赴下一程山海。" },
        我们万岁: { p: "圆满治愈者", t: "珍惜相遇，感恩同行，烟火寻常皆是浪漫。\n接纳所有圆满与不完美，岁岁安然，我们万岁。" }
      };
      var DIM_ORDER = ["Hp", "Hs", "Rs", "Db"];

      function sumIdxFor(answers, dim) {
        var s = 0;
        for (var i = 0; i < answers.length; i++) {
          if (answers[i] === dim) s += i + 1;
        }
        return s;
      }

      function firstTopDim(tops) {
        for (var o = 0; o < DIM_ORDER.length; o++) {
          if (tops.indexOf(DIM_ORDER[o]) >= 0) return DIM_ORDER[o];
        }
        return tops[0];
      }

      function pickVariant(answers, dim) {
        var t = sumIdxFor(answers, dim);
        return t % 4;
      }

      function resolveSongTitle(arr) {
        if (!arr || arr.length < TOTAL) return "——";
        var c = { Hp: 0, Hs: 0, Rs: 0, Db: 0 };
        for (var i = 0; i < arr.length; i++) c[arr[i]] += 1;
        var max = Math.max(c.Hp, c.Hs, c.Rs, c.Db);
        var tops = [];
        for (var d = 0; d < DIM_ORDER.length; d++) {
          if (c[DIM_ORDER[d]] === max) tops.push(DIM_ORDER[d]);
        }
        if (tops.length === 1) {
          var w1 = tops[0];
          return SONGS[w1][pickVariant(arr, w1)];
        }
        if (tops.length === 2) {
          var ra = tops[0];
          var rb = tops[1];
          if ((ra === "Hp" && rb === "Hs") || (ra === "Hs" && rb === "Hp")) return "黑洞";
          if ((ra === "Hs" && rb === "Rs") || (ra === "Rs" && rb === "Hs")) return "异梦";
          if ((ra === "Rs" && rb === "Db") || (ra === "Db" && rb === "Rs")) return "大人";
          if ((ra === "Hp" && rb === "Db") || (ra === "Db" && rb === "Hp")) return "七百年后";
          var w2 = firstTopDim(tops);
          return SONGS[w2][pickVariant(arr, w2)];
        }
        var w3 = firstTopDim(tops);
        return SONGS[w3][pickVariant(arr, w3)];
      }

      function showDone() {
        var title = resolveSongTitle(answers);
        var meta = RESULT_META[title] || { p: "——", t: "暂无可引用的短文案，请以歌名为准。" };
        if (quizPanel) quizPanel.hidden = true;
        if (donePanel) donePanel.hidden = false;
        var el = document.getElementById("result-song");
        if (el) el.textContent = "【" + title + "】";
        var elP = document.getElementById("result-personality");
        if (elP) elP.textContent = meta.p;
        var elC = document.getElementById("result-copy");
        if (elC) elC.textContent = meta.t;
        try {
          if (RESULT_META[title]) {
            localStorage.setItem("fnd_quiz_last_result_v1", JSON.stringify({ t: title }));
          }
        } catch (e) {}
        if (RESULT_META[title]) {
          try {
            var statKey = "fnd_quiz_stat_sent:" + title;
            if (!sessionStorage.getItem(statKey)) {
              fetch("/api/quiz/complete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: title }),
                keepalive: true
              }).then(function (res) {
                if (res.ok) sessionStorage.setItem(statKey, "1");
              }).catch(function () {});
            }
          } catch (e2) {}
        }
        window.scrollTo(0, 0);
      }

      if (idx >= TOTAL) {
        showDone();
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
