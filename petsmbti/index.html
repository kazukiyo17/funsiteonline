  <style>
    .hero {
      text-align: center;
      padding: 0.5rem 0 1rem;
    }

    .hero-illus {
      margin: 0 auto 1rem;
      max-width: 320px;
      height: 280px;
      position: relative;
      overflow: visible;
    }

    /* === Cat & Dog duo === */
    .petduo {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 1.25rem;
    }

    /* soft glow halo behind the pair */
    .petduo::before {
      content: '';
      position: absolute;
      top: 45%;
      left: 50%;
      width: 260px;
      height: 200px;
      margin-left: -130px;
      margin-top: -110px;
      background: radial-gradient(ellipse at center,
          rgba(255, 210, 150, 0.55) 0%,
          rgba(255, 210, 150, 0.25) 40%,
          rgba(255, 210, 150, 0) 70%);
      border-radius: 50%;
      z-index: 0;
      animation: petduo-pulse 4s ease-in-out infinite;
    }

    /* ground shadow */
    .petduo::after {
      content: '';
      position: absolute;
      bottom: 0.9rem;
      left: 50%;
      width: 220px;
      height: 14px;
      margin-left: -110px;
      background: radial-gradient(ellipse at center,
          rgba(108, 64, 24, 0.22) 0%,
          rgba(108, 64, 24, 0) 70%);
      z-index: 0;
    }

    .petduo-pet {
      position: relative;
      width: 130px;
      height: 160px;
      z-index: 2;
    }

    .petduo-cat {
      animation: petduo-bob 3.4s ease-in-out infinite;
    }

    .petduo-dog {
      transform: scaleX(-1);
      animation: petduo-bob 3.4s ease-in-out infinite 0.55s;
    }

    /* heart between them */
    .petduo-heart {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.4rem;
      z-index: 3;
      filter: drop-shadow(0 2px 4px rgba(255, 80, 110, 0.35));
      animation: petduo-heart 1.6s ease-in-out infinite;
    }

    /* floating sparkles / paws */
    .petduo-deco {
      position: absolute;
      z-index: 1;
      font-size: 0.9rem;
      opacity: 0.75;
      pointer-events: none;
      user-select: none;
    }

    .petduo-deco.d1 { top: 12%; left: 14%; animation: petduo-float 5s ease-in-out infinite; }
    .petduo-deco.d2 { top: 18%; right: 12%; font-size: 0.75rem; animation: petduo-float 5.5s ease-in-out infinite 0.8s; }
    .petduo-deco.d3 { bottom: 30%; left: 6%; font-size: 0.7rem; animation: petduo-float 6s ease-in-out infinite 1.4s; }
    .petduo-deco.d4 { top: 8%; left: 48%; font-size: 0.8rem; animation: petduo-float 4.5s ease-in-out infinite 2s; }
    .petduo-deco.d5 { bottom: 26%; right: 8%; animation: petduo-float 5s ease-in-out infinite 1.1s; }

    @keyframes petduo-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    /* dog is mirrored, so bob needs to preserve scaleX(-1) */
    .petduo-dog {
      animation-name: petduo-bob-mirror;
    }

    @keyframes petduo-bob-mirror {
      0%, 100% { transform: scaleX(-1) translateY(0); }
      50%      { transform: scaleX(-1) translateY(-6px); }
    }

    @keyframes petduo-heart {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -62%) scale(1.15); }
    }

    @keyframes petduo-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.7; transform: scale(1.08); }
    }

    @keyframes petduo-float {
      0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.75; }
      50%      { transform: translateY(-10px) rotate(6deg); opacity: 1; }
    }

    /* === Scoped cat/dog CSS === */
    .petduo .body {
      position: absolute;
      width: 90px;
      height: 100px;
    }
    .petduo .body::before,
    .petduo .body::after,
    .petduo .face::before,
    .petduo .face::after,
    .petduo .features::before,
    .petduo .features::after {
      content: '';
      position: absolute;
    }
    .petduo .face,
    .petduo .features { position: absolute; }

    .petduo .bodySlant {
      border-radius: 4px;
      transform-origin: 50% 100%;
      transform: perspective(300px) rotateX(20deg);
    }

    /* Cat */
    .petduo .cat {
      top: 40px;
      left: 20px;
      background-color: #e6ac4c;
    }
    .petduo .cat.earsBasic::before,
    .petduo .cat.earsBasic::after {
      width: 0;
      height: 0;
      top: -25px;
      border-top: 28px solid transparent;
      border-bottom: 20px solid transparent;
    }
    .petduo .cat.earsBasic::before {
      border-left: 20px solid #e6ac4c;
      left: 0;
    }
    .petduo .cat.earsBasic::after {
      border-right: 20px solid #e6ac4c;
      right: 0;
    }
    .petduo .cat .face {
      top: 22px;
      left: 20px;
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      box-shadow: 44px 0 #000;
      animation: sc-blink 8s infinite linear;
    }
    .petduo .cat .face::before,
    .petduo .cat .face::after {
      top: 14px;
      left: 6px;
      z-index: 5;
      width: 16px;
      height: 20px;
      border-radius: 50% / 40%;
      border-right: 2px solid #000;
      border-bottom: 2px solid #000;
      border-left: 2px solid transparent;
      border-top: 2px solid transparent;
      box-shadow: 0 0 #000;
    }
    .petduo .cat .face::after {
      left: 24px;
      transform: rotateY(180deg);
    }
    .petduo .cat .features {
      top: 44px;
      left: 11px;
      width: 20px;
      height: 1px;
      background-color: #000;
      box-shadow: 0 5px #000, 48px 0 #000, 48px 5px #000;
    }
    .petduo .cat .features::after {
      left: 30px;
      top: -6px;
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      box-shadow: 2px 0 #000, 1px 1px #000;
    }
    .petduo .cat .features::before {
      top: 10px;
      left: 74px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 5px solid #e6ac4c;
      border-left: 0;
      border-top: 0;
    }

    @keyframes sc-blink {
      32% { height: 6px; }
      38% { height: 1px; }
      42% { height: 1px; }
      48% { height: 6px; }
    }

    /* Dog */
    .petduo .dog {
      top: 40px;
      left: 20px;
      background-color: #a3701d;
    }
    .petduo .dog.earsBasic::before {
      top: -28px;
      left: 0;
      width: 0;
      height: 0;
      border-left: 30px solid #a3701d;
      border-radius: 30% 0 0 / 40% 40% 0 0;
      border-top: 28px solid transparent;
      border-bottom: 20px solid transparent;
    }
    .petduo .dog.earsBasic::after {
      top: -25px;
      right: 0;
      z-index: -5;
      width: 0;
      height: 0;
      border-right: 30px solid #a3701d;
      border-radius: 0 15px 0 0;
      border-top: 28px solid transparent;
      border-bottom: 20px solid transparent;
    }
    .petduo .dog .face {
      top: 22%;
      left: 22%;
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      box-shadow:
        44px 0 #000,
        19px 15px #000,
        21px 15px #000,
        23px 15px #000,
        25px 15px #000,
        22px 18px #000;
    }
    .petduo .dog .face::before,
    .petduo .dog .face::after {
      top: 14px;
      left: 6px;
      width: 16px;
      height: 20px;
      border-radius: 50% / 40%;
      border-right: 2px solid #000;
      border-bottom: 2px solid #000;
      border-left: 2px solid transparent;
      border-top: 2px solid transparent;
      box-shadow: 0 0 #000;
    }
    .petduo .dog .face::after {
      left: 24px;
      transform: rotateY(180deg);
    }
    .petduo .dog .features {
      right: 6px;
      top: 5px;
      z-index: -1;
      width: 30px;
      height: 35px;
      background-color: #d6d6d6;
      border-radius: 50% 40% 40% 50% / 30% 30% 30% 30%;
    }
    .petduo .dog .features::after {
      top: 51px;
      right: 34px;
      width: 10px;
      height: 10px;
      background-color: #df4f4f;
      border-radius: 0 0 50% 50%;
      animation: sc-tongue 1s infinite ease-in;
    }
    .petduo .dog .features::before {
      top: 35px;
      right: -35px;
      z-index: -1;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 5px solid #a3701d;
      border-left: 0;
      border-top: 0;
      box-shadow:
        3px 0 #f1f1f1,
        6px 5px #a3701d,
        9px 5px #f1f1f1,
        10px 12px #a3701d;
      animation: sc-wag 5s infinite ease-in-out;
    }

    @keyframes sc-tongue {
      0%  { height: 10px; }
      50% { height: 13px; }
    }

    @keyframes sc-wag {
      10% { top: 25px; right: -30px; transform: rotate(-20deg); }
      20% { top: 35px; right: -35px; transform: rotate(0); }
      30% { top: 25px; right: -30px; transform: rotate(-20deg); }
      40% { top: 35px; right: -35px; transform: rotate(0); }
      50% { top: 30px; right: -32px; transform: rotate(-10deg); }
      60% { top: 35px; right: -35px; transform: rotate(0); }
    }

    .pick-card h2 {

    .pick-card p {

    .section-title {

  </style>
