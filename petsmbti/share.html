<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>卡片 · 萌宠 MBTI</title>
  <meta name="description" content="生成并分享你家毛孩子的 MBTI 人格卡片 —— 萌宠 MBTI 专属分享页。" />
  <meta name="keywords" content="萌宠MBTI,分享卡片,宠物性格分享" />
  <meta name="theme-color" content="#e6ac4c" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://petsmbti.funsite.online/share.html" />

  <!-- Open Graph (由 EdgeOne Functions 按 pet/type 覆盖) -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="萌宠 MBTI" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="分享卡片 · 萌宠 MBTI" />
  <meta property="og:description" content="你家毛孩子的 MBTI 人格卡片。" />
  <meta property="og:url" content="https://petsmbti.funsite.online/share.html" />
  <meta property="og:image" content="https://petsmbti.funsite.online/og/home.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="分享卡片 · 萌宠 MBTI" />
  <meta name="twitter:description" content="你家毛孩子的 MBTI 人格卡片。" />
  <meta name="twitter:image" content="https://petsmbti.funsite.online/og/home.svg" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/pets-theme.css" />
  <style>
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .empty-state {
      text-align: center;
    }

    .empty-state p {
      color: var(--ink-soft);
      line-height: 1.65;
    }

    .share-panel {
      margin: 0;
      padding: 0;
    }

    .share-panel-title {
      margin: 0 0 1rem;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--orange-600);
      text-align: center;
    }

    .share-fields {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.15rem;
    }

    .share-field>.share-field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 0.35rem;
    }

    .share-field input[type="text"] {
      width: 100%;
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 2px solid var(--orange-200);
      background: var(--cream);
      color: var(--ink);
    }

    .share-field input[type="text"]:focus {
      outline: none;
      border-color: var(--orange-400);
      box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.25);
    }

    .share-photo-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .share-preview-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    .share-preview-card {
      display: block;
      position: relative;
      cursor: pointer;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(254, 215, 170, 0.85);
      background: var(--white);
      padding: 0;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .share-preview-card:hover {
      border-color: var(--orange-300);
      box-shadow: var(--shadow-card);
    }

    .share-photo-input:focus-visible+.share-preview-card {
      outline: none;
      border-color: var(--orange-400);
      box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.28), var(--shadow-card);
    }

    .share-preview-card:not(.has-photo) {
      cursor: pointer;
    }

    .share-preview-card.has-photo {
      cursor: default;
    }

    .share-change-photo-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.38rem 0.75rem;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.92);
      color: var(--orange-600);
      cursor: pointer;
      box-shadow: var(--shadow-card);
    }

    .share-change-photo-btn:hover {
      background: var(--white);
    }

    .share-preview-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.65rem 1rem 0.75rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(0.82rem, 2.5vw, 0.95rem);
      color: var(--white);
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      background: linear-gradient(transparent, rgba(63, 46, 40, 0.58));
      pointer-events: none;
      border-radius: 0 0 20px 20px;
    }

    #share-canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      margin: 0;
      border-radius: 20px;
      vertical-align: middle;
    }

    #share-canvas.has-photo {
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #share-canvas.has-photo.is-dragging {
      cursor: grabbing;
    }

    .share-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div class="page-wrap">
    <div id="has-share" class="card" hidden>
      <section class="share-panel" id="share-panel" aria-label="生成分享图">
        <h2 class="share-panel-title">生成分享图</h2>
        <div class="share-fields">
          <div class="share-field">
            <label class="share-field-label" for="share-pet-name">宠物名字</label>
            <input id="share-pet-name" type="text" maxlength="24" placeholder="我家毛孩子" autocomplete="off" />
          </div>
        </div>
        <div class="share-preview-wrap">
          <input id="share-photo" class="share-photo-input" type="file" accept="image/*" aria-label="选择宠物照片" />
          <div class="share-preview-card" id="share-preview-card">
            <canvas id="share-canvas" width="1080" height="1350" aria-label="分享图预览，点击上传照片"></canvas>
            <button type="button" class="share-change-photo-btn" id="share-change-photo" hidden>更换照片</button>
            <span class="share-preview-hint" id="share-preview-hint" aria-hidden="true">点击卡片上传照片</span>
          </div>
        </div>
        <div class="share-actions">
          <button type="button" class="btn btn-primary" id="share-download">下载分享图</button>
        </div>
      </section>

      <div class="actions">
        <a class="btn btn-ghost" href="result.html">返回结果</a>
        <a class="btn btn-primary" href="index.html">再测一次</a>
      </div>
    </div>

    <div id="no-share" class="card empty-state" hidden>
      <div class="pick-emoji" style="font-size: 3rem" aria-hidden="true">🐾</div>
      <h1 style="color: var(--orange-600); font-size: 1.35rem">还没有测试结果</h1>
      <p>请先完成问卷生成结果，再来制作分享图。</p>
      <a class="btn btn-primary" href="index.html#pick-pet">去选择宠物类型</a>
    </div>

    <div class="footer-social" role="group" aria-label="funsite.online · 作者社交账号：小红书 No, But? · 抖音 泥莫斯叭">
      <div class="footer-social__site-line">
        <span class="footer-social__site">funsite.online</span>
      </div>
      <div class="footer-social__accounts">
        <span class="footer-social__line">
          <svg class="footer-social__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor"
              d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H6V4h5v7l2.5-1.5L16 11V4h2v16z" />
          </svg>
          <span>No, But?</span>
        </span>
        <span class="footer-social__sep" aria-hidden="true">·</span>
        <span class="footer-social__line">
          <svg class="footer-social__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor"
              d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
          </svg>
          <span>泥莫斯叭</span>
        </span>
      </div>
    </div>
    <p class="footer-note">结果仅供娱乐 · 不构成行为或训练建议</p>
  </div>

  <script src="js/load-config.js"></script>
  <script src="js/petsmbti-share.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = "petsmbti_result_v1";
      var raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) { }
      var elHas = document.getElementById("has-share");
      var elNo = document.getElementById("no-share");
      if (!raw) {
        elNo.hidden = false;
        return;
      }
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        elNo.hidden = false;
        return;
      }
      if (!data || !data.code || !data.pet) {
        elNo.hidden = false;
        return;
      }

      loadPetsMbtiConfig()
        .then(function () {
          var pack = window.PETS_MBTI_QUESTIONS[data.pet];
          var titles = window.PETS_MBTI_RESULTS.titles[data.pet];
          if (!pack || !titles) {
            elNo.hidden = false;
            return;
          }

          elHas.hidden = false;
          var sharePanel = document.getElementById("share-panel");
          if (sharePanel) {
            var nick = titles[data.code] || "神秘毛孩子";
            sharePanel.setAttribute("aria-label", "生成分享图，" + data.code + "，" + nick);
          }

          if (typeof window.petsmbtiSetupShareUI === "function") {
            window.petsmbtiSetupShareUI({
              typeCode: data.code,
              typeNick: titles[data.code] || "神秘毛孩子",
              petEmoji: pack.emoji,
              petLabel: pack.petLabel,
            });
          }
        })
        .catch(function (err) {
          elHas.hidden = true;
          elNo.hidden = false;
          var p = elNo.querySelector("p");
          if (p) {
            p.textContent =
              "配置加载失败（请用本地静态服务器打开，勿使用 file://）。 " + (err && err.message ? err.message : String(err));
          }
        });
    })();
  </script>
</body>

</html>
