<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>问卷进行中 · 萌宠 MBTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/pets-theme.css" />
    <style>
      .quiz-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .quiz-title-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .quiz-title-row .emoji {
        font-size: 1.75rem;
      }
      .progress-wrap {
        width: 100%;
        height: 12px;
        background: var(--orange-100);
        border-radius: 999px;
        overflow: hidden;
        border: 2px solid var(--orange-200);
        margin-bottom: 1.25rem;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--orange-300), var(--orange-500));
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      .section-tag {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--orange-600);
        margin-bottom: 0.35rem;
      }
      .q-text {
        font-size: 1.08rem;
        font-weight: 700;
        margin: 0 0 1rem;
        line-height: 1.45;
      }
      .choices {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      .choice {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.85rem 1rem;
        border-radius: var(--radius-md);
        border: 3px solid var(--orange-100);
        background: var(--cream);
        font-family: var(--font-body);
        font-size: 0.95rem;
        line-height: 1.45;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
      }
      .choice:hover {
        border-color: var(--orange-300);
        background: var(--white);
      }
      .choice:active {
        transform: scale(0.99);
      }
      .choice.selected-a,
      .choice.selected-b {
        border-color: var(--orange-500);
        background: var(--orange-50);
        box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
      }
      .choice-label {
        display: inline-block;
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--orange-600);
        margin-right: 0.35rem;
      }
      .nav-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1.35rem;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .q-counter {
        font-size: 0.9rem;
        color: var(--ink-soft);
        font-weight: 600;
        margin-left: auto;
      }
      .error-banner {
        display: none;
        background: #fff1f2;
        color: #9f1239;
        padding: 0.65rem 1rem;
        border-radius: var(--radius-sm);
        margin-bottom: 1rem;
        font-size: 0.9rem;
        border: 2px solid #fecdd3;
      }
      .error-banner.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div id="screen-quiz" class="card" hidden>
        <div class="quiz-top">
          <div class="quiz-title-row">
            <span class="emoji" id="quiz-emoji">🐾</span>
            <h1 style="margin: 0; font-size: 1.25rem; color: var(--orange-600)" id="quiz-heading">问卷</h1>
          </div>
          <a class="btn btn-ghost" href="index.html">返回封面</a>
        </div>
        <div class="error-banner" id="error-banner" role="alert"></div>
        <div class="progress-wrap" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="section-label" class="section-tag"></div>
        <p class="q-text" id="q-text"></p>
        <div class="choices">
          <button type="button" class="choice" id="btn-a" data-value="A"></button>
          <button type="button" class="choice" id="btn-b" data-value="B"></button>
        </div>
        <div class="nav-row">
          <button type="button" class="btn btn-ghost" id="btn-prev">上一题</button>
          <span class="q-counter" id="q-counter"></span>
        </div>
      </div>

      <p class="footer-note" id="quiz-footer-note" hidden>答题进度仅保存在本机浏览器，提交后生成结果页</p>
    </div>

    <script src="js/load-config.js"></script>
    <script src="js/report-complete.js"></script>
    <script>
      (function () {
        var STORAGE_KEY = "petsmbti_result_v1";
        var params = new URLSearchParams(location.search);
        var petKey = params.get("pet");
        var wrap = document.querySelector(".page-wrap");

        function showBootError(title, detail) {
          wrap.innerHTML =
            '<div class="card"><p><strong>' +
            title +
            "</strong></p>" +
            (detail ? '<p style="color:var(--ink-soft);font-size:0.9rem;margin-top:0.5rem">' + detail + "</p>" : "") +
            '<p style="margin-top:1rem"><a class="btn btn-ghost" href="choose-pet.html">选择宠物类型</a> <a class="btn btn-primary" href="index.html">返回封面</a></p></div>';
        }

        if (!petKey) {
          showBootError("缺少宠物类型参数。", "请从「选择宠物类型」页进入问卷。");
          return;
        }

        loadPetsMbtiConfig()
          .then(function () {
            if (!window.PETS_MBTI_QUESTIONS[petKey]) {
              showBootError("未知的宠物类型。", "");
              return;
            }
            runQuiz();
          })
          .catch(function (err) {
            showBootError(
              "问卷配置加载失败。",
              "请通过本地静态服务器打开（如 VS Code Live Server、npx serve），不要直接用 file:// 双击打开。 " + (err && err.message ? err.message : String(err))
            );
          });

        function runQuiz() {
        var pack = window.PETS_MBTI_QUESTIONS[petKey];
        var answers = new Array(24).fill(null);
        var index = 0;

        document.getElementById("screen-quiz").hidden = false;
        var foot = document.getElementById("quiz-footer-note");
        if (foot) foot.hidden = false;

        document.getElementById("quiz-emoji").textContent = pack.emoji;
        document.getElementById("quiz-heading").textContent = pack.petLabel + "MBTI";
        renderQuestion();

        function sectionFor(i) {
          for (var s = 0; s < pack.sections.length; s++) {
            var sec = pack.sections[s];
            if (i >= sec.start && i < sec.end) return sec;
          }
          return pack.sections[0];
        }

        function renderQuestion() {
          var row = pack.items[index];
          var sec = sectionFor(index);
          document.getElementById("section-label").textContent = sec.name + " · " + sec.sub;
          document.getElementById("q-text").textContent = index + 1 + ". " + row[0];
          document.getElementById("btn-a").innerHTML = '<span class="choice-label">A</span>' + row[1];
          document.getElementById("btn-b").innerHTML = '<span class="choice-label">B</span>' + row[2];
          document.getElementById("q-counter").textContent = index + 1 + " / 24";
          var filled = answers.filter(Boolean).length;
          document.getElementById("progress-bar").style.width = Math.round((filled / 24) * 100) + "%";

          document.getElementById("btn-a").classList.toggle("selected-a", answers[index] === "A");
          document.getElementById("btn-b").classList.toggle("selected-b", answers[index] === "B");

          document.getElementById("btn-prev").disabled = index === 0;
          hideError();
        }

        function hideError() {
          var b = document.getElementById("error-banner");
          b.classList.remove("visible");
          b.textContent = "";
        }
        function showError(msg) {
          var b = document.getElementById("error-banner");
          b.textContent = msg;
          b.classList.add("visible");
        }

        function scoreDimension(start, end, letterA, letterB) {
          var a = 0,
            b = 0;
          for (var i = start; i < end; i++) {
            if (answers[i] === "A") a++;
            else if (answers[i] === "B") b++;
          }
          var tie = a === b;
          var letter = a > b ? letterA : b > a ? letterB : letterA;
          return { a: a, b: b, letter: letter, tie: tie };
        }

        function submitResults() {
          for (var j = 0; j < 24; j++) {
            if (answers[j] === null) {
              showError("还有题目没完成，检查一下就好啦～");
              return;
            }
          }
          var d1 = scoreDimension(0, 6, "E", "I");
          var d2 = scoreDimension(6, 12, "S", "N");
          var d3 = scoreDimension(12, 18, "T", "F");
          var d4 = scoreDimension(18, 24, "J", "P");
          var code = d1.letter + d2.letter + d3.letter + d4.letter;
          var payload = {
            pet: petKey,
            code: code,
            dimensions: [
              { pair: "E/I", ...d1 },
              { pair: "S/N", ...d2 },
              { pair: "T/F", ...d3 },
              { pair: "J/P", ...d4 },
            ],
            answers: answers.slice(),
            at: Date.now(),
          };
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            reportPetsmbtiQuizComplete(petKey, code).catch(function () {});
          } catch (e) {}
          location.href = "result.html";
        }

        function pick(val) {
          answers[index] = val;
          hideError();
          if (index < 23) {
            index++;
            renderQuestion();
          } else {
            submitResults();
          }
        }
        document.getElementById("btn-a").addEventListener("click", function () {
          pick("A");
        });
        document.getElementById("btn-b").addEventListener("click", function () {
          pick("B");
        });

        document.getElementById("btn-prev").addEventListener("click", function () {
          if (index > 0) {
            index--;
            renderQuestion();
          }
        });
        }
      })();
    </script>
  </body>
</html>
